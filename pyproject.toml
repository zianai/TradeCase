[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradecase"
version = "0.1.0"
description = "Evidence-first, Agent-native trade inquiry tools derived from B2B Lead Hunter"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pydantic==2.14.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.3"]
platform = [
    "alembic==1.20.1",
    "arq==0.28.0",
    "boto3==1.43.120",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "langgraph==1.2.18",
    "langgraph-checkpoint-postgres==3.2.0",
    "langgraph-checkpoint-sqlite==3.1.2",
    "openai-agents==0.24.0",
    "psycopg[binary,pool]==3.3.6",
    "python-multipart==0.0.32",
    "redis==5.3.1",
    "reportlab==5.1.0",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[project.scripts]
tradecase = "tradecase.cli:main"
tradecase-workbench = "tradecase.platform.cli:main"

[tool.setuptools]
packages = ["tradecase", "tradecase.visual", "tradecase.platform", "tradecase.models", "tradecase.ingestion", "tradecase.vendor", "tradecase.vendor.ai_hunter", "tradecase_upstream"]
include-package-data = true

[tool.setuptools.package-dir]
tradecase = "src/tradecase"
tradecase_upstream = "scripts"

[tool.setuptools.package-data]
"tradecase.vendor.ai_hunter" = ["LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
